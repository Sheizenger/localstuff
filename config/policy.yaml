# Политика безопасности. Всё, что не разрешено явно, — запрещено.

filesystem:
  # Пути относительно корня репозитория.
  read_allow:  ["**"]
  write_allow: ["var/**", "skills/_proposed/**", "runs/**", "docs/**", "evals/**"]
  write_deny:  [".git/**", ".env", "**/*.pem", "**/id_rsa*", "**/.ssh/**"]
  max_file_bytes: 5242880

shell:
  enabled: true
  # Разрешены только эти исполняемые файлы (первое слово команды).
  # Оболочек (sh/bash/zsh) здесь намеренно нет: они обошли бы весь allowlist.
  allow_binaries: [git, make, python3, python, pytest, ruff, mypy, uv, pip,
                   ls, cat, grep, rg, find, sed, awk, head, tail, wc, sort, uniq, cut, tr,
                   diff, jq, yq, echo, pwd, date, which, env,
                   mkdir, cp, mv, touch, tee, xargs, node, npm, npx,
                   "true", "false", "test"]
  deny_patterns:
    - "rm\\s+-rf\\s+/"
    - "curl.*\\|\\s*(ba)?sh"
    - "wget.*\\|\\s*(ba)?sh"
    - ":\\(\\)\\{.*\\};:"
    - "chmod\\s+777\\s+/"
    - "git\\s+push\\s+--force"
  timeout_s: 300

network:
  enabled: true
  # Пусто = разрешены любые хосты, кроме deny. Заполни, чтобы сузить.
  allow_hosts: []
  deny_hosts: ["169.254.169.254", "metadata.google.internal", "localhost:*"]

approval:
  # Действия, требующие явного подтверждения человека.
  # Агент ставит задачу в BLOCKED_APPROVAL и продолжает остальные ветки.
  require_human:
    - git_push
    - open_pull_request
    - write_outside_allowlist   # запись вне filesystem.write_allow
    - delete_outside_var
    - spend_over_usd: 5.0
    - install_system_package
    - enable_mcp_server_not_in_catalog

secrets:
  # Откуда можно читать секреты. В БД и в логи они не попадают никогда.
  sources: [env, dotenv]
  # Маски для редакции в логах и отчётах.
  redact_patterns:
    - "sk-[A-Za-z0-9_\\-]{16,}"
    - "AIza[0-9A-Za-z_\\-]{30,}"
    - "gh[pousr]_[A-Za-z0-9]{20,}"
    - "(?i)(api[_-]?key|token|secret|password)\\s*[=:]\\s*\\S+"
