name: CI

# Секреты не нужны: ни один тест не ходит в сеть и не требует API-ключей.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Собрать окружение
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Линтер
        run: .venv/bin/ruff check agentos tests

      - name: Типы
        run: .venv/bin/mypy

      - name: Проверка окружения
        run: .venv/bin/agentctl doctor

      - name: Тесты
        run: .venv/bin/python -m pytest -m "not live" --cov=agentos --cov-report=term-missing

      - name: Эталонные миссии
        # Гейт против регрессий самоулучшения: система правит собственные
        # промпты и навыки, ей нужна неподвижная точка отсчёта.
        run: .venv/bin/agentctl eval run

  # Обещание «поставил один раз — подключай везде» ломается тихо: сборка
  # wheel уже один раз оказалась битой, и заметить это можно было только
  # реальной установкой. Поэтому путь проверяется целиком, а не тестами.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTOS_ALLOW_MOCK: "1"
      AGENTOS_IN_GATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Поставить AgentOS глобальным инструментом
        run: |
          # --reinstall обязателен: без него uv переиспользует собранный
          # ранее wheel той же версии, и проверка идёт по старому коду.
          uv tool install --force --reinstall .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Подключить к постороннему проекту и прогнать миссию
        run: |
          set -euo pipefail
          project="$(mktemp -d)/foreign-project"
          mkdir -p "$project" && cd "$project"
          git init -q .
          printf 'node_modules/\n' > .gitignore
          printf '{"mcpServers":{"github":{"command":"npx","args":[]}}}\n' > .mcp.json

          agentctl install
          agentctl doctor
          agentctl goal "проверить установку"

          test -f .agentos/var/agentos.db || { echo "состояние не легло в проект"; exit 1; }
          grep -q '"github"' .mcp.json || { echo "чужой MCP-сервер вытеснен"; exit 1; }
          grep -q '"agentos"' .mcp.json || { echo "MCP-сервер не зарегистрирован"; exit 1; }
          grep -q 'alwaysApply: true' .cursor/rules/agentos.mdc \
            || { echo "правило Cursor без frontmatter"; exit 1; }

          # Навыки едут в пакете: без чекаута рядом их взять больше неоткуда.
          agentctl doctor | grep -q 'Навыки: (нет)' \
            && { echo "навыки не приехали вместе с пакетом"; exit 1; }

          # Гейт из умолчаний в чужом проекте — красная приёмка навсегда.
          grep -q 'make test' .agentos/config/agentos.yaml \
            && { echo "гейты взяты из умолчаний, а не из проекта"; exit 1; }

          # Песочница: команда должна собираться и без демона docker.
          agentctl sandbox --print-command doctor | grep -q -- '--security-opt' \
            || { echo "песочница запускается без ограничений"; exit 1; }

          # Два мастер-агента в одном проекте не видят миссий друг друга.
          AGENTOS_AGENT_ID=alpha agentctl goal "первая задача" >/dev/null
          AGENTOS_AGENT_ID=beta agentctl status --json \
            | grep -q 'первая задача' \
            && { echo "чужая миссия видна другому мастер-агенту"; exit 1; }

      - name: Проверить рукопожатие MCP
        run: |
          set -euo pipefail
          cat > /tmp/probe.py <<'PY'
          import json
          import sys

          result = json.load(sys.stdin)["result"]
          assert result["serverInfo"]["name"] == "agentos", result
          assert "agentos_resume" in result["instructions"], "контракт не доехал до хоста"
          print("рукопожатие ok:", result["serverInfo"])
          PY
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n' \
            | agentctl mcp | python3 /tmp/probe.py
