[project]
name = "agentos"
version = "0.1.0"
description = "Provider-agnostic autonomous multi-agent OS: durable memory, skills, token-aware parallelism, auto-resume."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
google = ["google-genai>=0.3"]
mcp = ["mcp>=1.0"]
hindsight = ["hindsight-client>=0.1"]
hindsight-embedded = ["hindsight-all>=0.1"]
vector = ["numpy>=1.26"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
all = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.3",
    "mcp>=1.0",
    "numpy>=1.26",
    "hindsight-client>=0.1",
]

[project.scripts]
agentctl = "agentos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

# Навыки едут внутри пакета: без них agentctl в чужом проекте показывает
# «Навыки: (нет)», а навыки — заявленная часть системы. В репозитории они
# лежат в skills/, в wheel — в agentos/defaults/skills.
# Проверяется тестом test_skills_ship_with_the_package.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "agentos/defaults/skills"

# agentos/defaults лежит внутри пакета и попадает в wheel вместе с ним:
# без этих файлов установленный глобально agentctl не смог бы работать
# в чужом проекте. Проверяется тестом test_defaults_ship_with_the_package.

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["HorizonFinance", "var", ".agentos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM105"]

[tool.mypy]
python_version = "3.11"
files = ["agentos"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that require real provider API keys (skipped by default)",
]
