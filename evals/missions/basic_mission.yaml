# Базовая проверка: абстрактная цель проходит весь путь до результата.
name: базовая миссия
goal: составить краткую сводку по проекту
expect:
  min_done_tasks: 3      # план должен разложиться минимум на три задачи
  no_failed: true        # ни одна задача не должна упасть насовсем
  max_tokens: 60000      # защита от разрастания промптов при самоулучшении
